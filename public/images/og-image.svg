<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F" />
      <stop offset="50%" stop-color="#11131A" />
      <stop offset="100%" stop-color="#090A0F" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF0033" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="600" cy="315" r="450" fill="url(#glow)" filter="blur(80px)" />

  <g transform="translate(600, 220)" text-anchor="middle">
    <!-- Icon representation -->
    <rect x="-45" y="-95" width="90" height="90" rx="24" fill="#181B24" stroke="#282D3D" stroke-width="2" />
    <path d="M-15 -35 C -15 -60, 15 -60, 15 -35" stroke="#00E599" stroke-width="6" fill="none" stroke-linecap="round" />
    <circle cx="-15" cy="-35" r="12" fill="#00E599" />
    <circle cx="15" cy="-35" r="12" fill="#8B5CF6" />

    <!-- Brand Name -->
    <text y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">
      Playlist<tspan fill="#00E599">Shift</tspan>
    </text>

    <!-- Tagline -->
    <text y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="url(#textGrad)">
      Your Music. Your Platform. One Click Away.
    </text>

    <!-- Supporting Text -->
    <text y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#8E95A5">
      Free Spotify to YouTube &amp; YouTube Music Playlist Converter
    </text>
  </g>
</svg>

